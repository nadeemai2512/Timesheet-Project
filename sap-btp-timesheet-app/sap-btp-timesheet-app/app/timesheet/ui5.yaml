specVersion: "3.0"
metadata:
  name: com.company.timesheet
type: application
framework:
  name: SAPUI5
  version: "1.120.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.f
    - name: sap.suite.ui.commons
    - name: sap.viz
    - name: sap.tnt
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        backend:
          - path: /odata
            url: http://localhost:4004
