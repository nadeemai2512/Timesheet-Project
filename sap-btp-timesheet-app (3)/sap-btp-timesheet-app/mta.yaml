_schema-version: "3.1"
ID: sap-btp-timesheet-app
description: Unified SAPUI5 & SAP CAP Timesheet Application on SAP BTP
version: 1.0.0

modules:
  - name: timesheet-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: timesheet-db
      - name: timesheet-uaa
      - name: timesheet-destination
      - name: timesheet-connectivity
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M

  - name: timesheet-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: timesheet-db
    parameters:
      buildpack: nodejs_buildpack

  - name: timesheet-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: timesheet-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - comcompanytimesheet.zip
          name: comcompanytimesheet
          target-path: resources/

  - name: comcompanytimesheet
    type: html5
    path: app/timesheet
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

resources:
  - name: timesheet-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: timesheet-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  - name: timesheet-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: timesheet-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite

  - name: timesheet-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
